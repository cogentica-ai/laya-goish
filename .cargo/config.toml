[build]
target = "x86_64-unknown-linux-gnu"
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C","link-arg=-nostartfiles","-C","link-arg=-nodefaultlibs","-C","link-arg=-static","-C","link-arg=-Wl,--no-dynamic-linker","-C","relocation-model=static","-C","force-frame-pointers=yes"]
# Native macOS build: `cargo build --target aarch64-apple-darwin`. Darwin links
# libSystem dynamically and requires PIE, so none of the Linux flags apply.
[target.aarch64-apple-darwin]
rustflags = ["-C","force-frame-pointers=yes"]
